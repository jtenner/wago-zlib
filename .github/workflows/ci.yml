name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux amd64 / Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22.x", stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Format
        shell: bash
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      - run: go test -race -shuffle=on -count=1 ./...
      - name: Provider catalog is current
        run: go run github.com/wago-org/wago/cli/wago@v0.1.0-beta.11 plugin catalog --check --manifest wago.json --no-input

  tinygo-host:
    name: TinyGo host / Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
          cache-dependency-path: go.sum
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        with:
          tinygo-version: "0.41.1"
          install-binaryen: false
      - name: Install TinyGo native linker
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Execute TinyGo-hosted codec and Wago ABI integration
        env:
          GOMAXPROCS: "4"
          TINYGO_JOBS: "4"
        run: scripts/test-tinygo-host.sh
